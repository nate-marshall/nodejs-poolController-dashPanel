    <script>
        // Modern dashboard initialization
        document.addEventListener('DOMContentLoaded', () => {
            const dashboard = {
                init() {
                    this.setupTheme();
                    this.setupBackground();
                    this.setupAccessibility();
                },
                
                setupTheme() {
                    const theme = this.getStorage('dashTheme', 'default');
                    const link = document.createElement('link');
                    link.id = 'cssref_theme';
                    link.rel = 'stylesheet';
                    link.href = `themes/${theme}/theme.css`;
                    link.setAttribute('data-theme', theme);
                    document.head.appendChild(link);
                },
                
                setupBackground() {
                    const background = this.getStorage('dashBackground', '');
                    if (background) {
                        document.body.style.backgroundImage = `url(${background})`;
                    }
                },
                
                setupAccessibility() {
                    // Add keyboard navigation support
                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Tab') {
                            document.body.classList.add('keyboard-navigation');
                        }
                    });
                    
                    document.addEventListener('mousedown', () => {
                        document.body.classList.remove('keyboard-navigation');
                    });
                },
                
                getStorage(key, defaultValue) {
                    try {
                        const value = localStorage.getItem(key);
                        return value !== null ? value : defaultValue;
                    } catch (e) {
                        console.warn('localStorage not available:', e);
                        return defaultValue;
                    }
                }
            };
            
            dashboard.init();
        });
    </script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="dashboard-app picDashboard" data-panel="dashboard">
        <header class="dashboard-header picHeader">
            <section class="controller-panel picController picControlPanel control-panel"></section>
        </header>
        
        <main id="main-content" class="dashboard-main dashContainer">
            <div class="dashboard-grid container1">
                <section class="panel bodies-panel picBodies picControlPanel control-panel" aria-label="Pool Bodies">
                    <h2 class="visually-hidden">Pool Bodies</h2>
                </section>
                
                <section class="panel chemistry-panel picChemistry picControlPanel control-panel" aria-label="Chemistry Control">
                    <h2 class="visually-hidden">Chemistry Control</h2>
                </section>

                </section>

                    <h2 class="visually-hidden">Schedules</h2>
                </section>
                
                <section class="panel circuits-panel picCircuits picControlPanel control-panel" aria-label="Circuit Control">
                    <h2 class="visually-hidden">Circuit Control</h2>
                </section>

            </div>
            
            <div class="dashboard-secondary container2"></div>
            <div class="dashboard-tertiary container3"></div>
        </main>
        
        <aside class="config-container configContainer" aria-label="Configuration Panel">
        </aside>
    </div>

    <script>
        // Enhanced widget initialization with modern JavaScript
        $(document).ready(() => {
            const widgetInitializer = {
                widgets: [
                    { selector: 'div.picDashboard', method: 'dashboard' },
                    { selector: 'div.picController', method: 'controller' },
                    { selector: 'div.picBodies', method: 'bodies' },
                    { selector: 'div.picCircuits', method: 'circuits' },
                    { selector: 'div.picLights', method: 'lights' },
                    { selector: 'div.picPumps', method: 'pumps' },
                    { selector: 'div.picChemistry', method: 'chemistry' },
                    { selector: 'div.picSchedules', method: 'schedules' },
                    { selector: 'div.picFilters', method: 'bodyFilters' }
                ],
                
                init() {
                    this.initializeWidgets();
                    this.setupErrorHandling();
                    this.setupPerformanceMonitoring();
                },
                
                initializeWidgets() {
                    this.widgets.forEach(({ selector, method }) => {
                        try {
                            const $element = $(selector);
                            if ($element.length && typeof $element[method] === 'function') {
                                $element[method]();
                                console.log(`Initialized ${method} widget`);
                            }
                        } catch (error) {
                            console.error(`Failed to initialize ${method} widget:`, error);
                        }
                    });
                },
                
                setupErrorHandling() {
                    window.addEventListener('error', (event) => {
                        console.error('Global error:', event.error);
                    });
                    
                    window.addEventListener('unhandledrejection', (event) => {
                        console.error('Unhandled promise rejection:', event.reason);
                    });
                },
                
                setupPerformanceMonitoring() {
                    if ('performance' in window) {
                        setTimeout(() => {
                            const timing = performance.timing;
                            const loadTime = timing.loadEventEnd - timing.navigationStart;
                            console.log(`Page load time: ${loadTime}ms`);
                        }, 0);
                    }
                }
            };
            
            widgetInitializer.init();
        });
    </script>
